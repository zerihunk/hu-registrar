<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HU Registrar | Workflow History System</title>
    <style>
        :root { --primary: #1a252f; --accent: #3498db; --bg: #f4f7fa; --border: #e1e8ed; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: var(--bg); }
        .sidebar { width: 250px; background: var(--primary); color: white; flex-shrink: 0; display: flex; flex-direction: column; }
        .nav { padding: 15px 25px; cursor: pointer; color: #95a5a6; }
        .nav.active { background: rgba(255,255,255,0.1); color: white; border-left: 4px solid var(--accent); }
        .main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 60px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .content { padding: 25px; overflow-y: auto; flex-grow: 1; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        th { background: #f8f9fa; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #e1f5fe; color: #03a9f4; }
        .history-item { font-size: 0.8rem; color: #666; border-left: 2px solid var(--accent); padding-left: 10px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="text-align: center; color: var(--accent);">HU Cloud</h2>
        <div class="nav active" onclick="showView('dash', this)">Live Dashboard</div>
        <div class="nav" onclick="showView('reg', this)">New Registration</div>
        <div class="nav" onclick="showView('sys', this)">System Config</div>
        <div class="nav" onclick="logout()" style="margin-top: auto;">Logout</div>
    </div>

    <div class="main">
        <div class="header">
            <div id="userMail">Syncing...</div>
            <div style="font-weight: bold;">Status: <span style="color: green;">Online (Firebase)</span></div>
        </div>

        <div class="content">
            <div id="dashView" class="view-section active">
                <div class="card">
                    <h3>Current Student Workflow Status</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Student Name</th>
                                <th>Modality / Service</th>
                                <th>Current Status</th>
                                <th>History Log</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTbl"></tbody>
                    </table>
                </div>
            </div>

            <div id="regView" class="view-section" style="display:none;">
                <div class="card" style="max-width: 500px;">
                    <h3>New Entry</h3>
                    <input type="text" id="sName" placeholder="Full Name" style="width:100%; padding:10px; margin-bottom:10px;">
                    <label>Award Date</label>
                    <input type="date" id="sDate" style="width:100%; padding:10px; margin-bottom:10px;">
                    <select id="dropMod" style="width:100%; padding:10px; margin-bottom:10px;"></select>
                    <select id="dropServ" style="width:100%; padding:10px; margin-bottom:10px;"></select>
                    <button onclick="registerStudent()" style="background:var(--accent); color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer;">Register & Start Workflow</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, addDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLFipN6v4UCa4D429-J7N4BidGgPXSazY",
            authDomain: "hu-registrar-a915c.firebaseapp.com",
            projectId: "hu-registrar-a915c",
            storageBucket: "hu-registrar-a915c.firebasestorage.app",
            messagingSenderId: "335596409610",
            appId: "1:335596409610:web:01367dd58f9dcb64bb20f3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserEmail = "";

        // 1. ምዝገባ እና የመጀመሪያ ወርክ ፍሎው ታሪክ መፍጠር
        window.registerStudent = async () => {
            const name = document.getElementById('sName').value;
            const status = "Registered";
            const timestamp = new Date().toLocaleString();

            const studentData = {
                name: name,
                awardDate: document.getElementById('sDate').value,
                modality: document.getElementById('dropMod').value,
                service: document.getElementById('dropServ').value,
                currentStatus: status,
                // የታሪክ መዝገብ (Workflow History)
                history: [{
                    status: status,
                    time: timestamp,
                    user: currentUserEmail
                }]
            };

            await addDoc(collection(db, "students"), studentData);
            alert("Student registered and workflow started!");
            showView('dash');
        };

        // 2. የተማሪን ደረጃ መቀየር (Update Workflow)
        window.updateWorkflow = async (id, nextStatus) => {
            const timestamp = new Date().toLocaleString();
            const studentRef = doc(db, "students", id);

            await updateDoc(studentRef, {
                currentStatus: nextStatus,
                // አዲሱን ታሪክ ወደ ድሮው ታሪክ መጨመር (Array Union)
                history: arrayUnion({
                    status: nextStatus,
                    time: timestamp,
                    user: currentUserEmail
                })
            });
        };

        // 3. ዳሽቦርድ ላይ ዳታውን በሪል ታይም ማሳየት
        function listenToData() {
            onSnapshot(collection(db, "students"), (snap) => {
                const tbl = document.getElementById('studentTbl');
                tbl.innerHTML = "";

                snap.forEach((doc) => {
                    const s = doc.data();
                    const id = doc.id;
                    
                    // የታሪክ ዝርዝርን ማዘጋጀት
                    const historyHtml = s.history.map(h => 
                        `<div class="history-item"><b>${h.status}</b> <br> <small>${h.time} by ${h.user}</small></div>`
                    ).join('');

                    tbl.innerHTML += `
                        <tr>
                            <td><b>${s.name}</b></td>
                            <td>${s.modality} / ${s.service}</td>
                            <td><span class="badge">${s.currentStatus}</span></td>
                            <td>${historyHtml}</td>
                            <td>
                                <select onchange="updateWorkflow('${id}', this.value)">
                                    <option value="">Move to...</option>
                                    <option value="Admission">Admission</option>
                                    <option value="Finance">Finance</option>
                                    <option value="Registrar">Registrar</option>
                                    <option value="Completed">Completed</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });
            });

            // Config sync (Modality/Service)
            onSnapshot(doc(db, "config", "general"), (snap) => {
                const d = snap.data();
                document.getElementById('dropMod').innerHTML = d.studymodalitys.map(x => `<option>${x}</option>`).join('');
                document.getElementById('dropServ').innerHTML = d.services.map(x => `<option>${x}</option>`).join('');
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserEmail = user.email;
                document.getElementById('userMail').innerText = user.email;
                listenToData();
            } else {
                // Redirect if logout
            }
        });

        window.showView = (v) => {
            document.querySelectorAll('.view-section').forEach(x => x.style.display = 'none');
            document.getElementById(v + 'View').style.display = 'block';
        };

        window.logout = () => signOut(auth);
    </script>
</body>
</html>
