<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HU Registrar | Advanced System</title>
    <style>
        :root { --primary: #1a252f; --accent: #3498db; --bg: #f4f7fa; --border: #e1e8ed; --danger: #e74c3c; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); height: 100vh; display: flex; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--primary); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .brand { padding: 25px; font-size: 1.3rem; font-weight: bold; color: var(--accent); border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .nav { padding: 15px 25px; cursor: pointer; color: #95a5a6; display: flex; align-items: center; gap: 12px; transition: 0.3s; }
        .nav:hover, .nav.active { color: white; background: rgba(255,255,255,0.1); border-left: 4px solid var(--accent); }
        .admin-only, .staff-only { display: none; }

        /* Main Content */
        .main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 70px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
        .content { padding: 25px; overflow-y: auto; flex-grow: 1; }

        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        .student-name { color: var(--accent); cursor: pointer; font-weight: bold; text-decoration: underline; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 10000; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 500px; max-height: 80vh; overflow-y: auto; }
        
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; }
        button { padding: 12px 20px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-close { background: #95a5a6; margin-top: 10px; width: 100%; }

        .view-section { display: none; }
        .view-section.active { display: block; }
        .badge { background: #e3f2fd; color: #1976d2; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loginOverlay" style="position: fixed; inset: 0; background: #1a252f; display: flex; align-items: center; justify-content: center; z-index: 9999;">
        <div class="card" style="width: 350px; text-align: center;">
            <h2 style="color: var(--primary);">HU Registrar Login</h2>
            <input type="email" id="loginEmail" placeholder="Email Address">
            <input type="password" id="loginPass" placeholder="Password">
            <button style="width: 100%;" onclick="handleLogin()">Sign In</button>
        </div>
    </div>

    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h3 id="modalStudentName">Student Detail</h3>
            <hr>
            <h4>Workflow History</h4>
            <div id="historyLog" style="font-size: 0.85rem; margin-bottom: 20px; background: #f9f9f9; padding: 10px; border-radius: 6px;"></div>
            
            <h4>Move To / Update Status</h4>
            <label>Select Role (Next Step)</label>
            <select id="moveRole"></select>
            <label>Select Office/Room</label>
            <select id="moveOffice"></select>
            
            <h4>Update Services</h4>
            <div id="serviceCheckboxes" style="margin-bottom: 15px;"></div>
            
            <button onclick="saveStudentUpdate()" style="width: 100%;">Update & Move</button>
            <button class="btn-close" onclick="closeModal()">Close</button>
        </div>
    </div>

    <div id="mainApp" style="display: none; width: 100%;">
        <div class="sidebar">
            <div class="brand">HU CLOUD</div>
            <div class="nav active" onclick="showView('dash', this)">Dashboard</div>
            <div class="nav staff-only" onclick="showView('reg', this)">Register Student</div>
            <div class="nav admin-only" onclick="showView('staff', this)">Staff Manager</div>
            <div class="nav admin-only" onclick="showView('sys', this)">System Config</div>
            <div style="margin-top:auto;" class="nav" onclick="handleLogout()">Logout</div>
        </div>

        <div class="main">
            <div class="header">
                <div>
                    <span id="userInfo" style="font-weight:bold;">User</span>
                    <span id="roleBadge" class="badge" style="margin-left: 10px;"></span>
                </div>
            </div>

            <div class="content">
                <div id="dashView" class="view-section active">
                    <div class="card">
                        <h3>Live Student Tracker</h3>
                        <table id="studentTbl">
                            <thead>
                                <tr><th>Student Name</th><th>Dept</th><th>Status</th><th>Current Office</th><th>Services</th></tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div id="regView" class="view-section">
                    <div class="card" style="max-width: 500px;">
                        <h3>New Student Registration</h3>
                        <input type="text" id="sName" placeholder="Full Name">
                        <select id="dropDept"></select>
                        <select id="dropModality"></select>
                        <div id="regServices"></div>
                        <button onclick="registerStudent()">Register</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, getDocs, collection, addDoc, updateDoc, arrayUnion, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLFipN6v4UCa4D429-J7N4BidGgPXSazY",
            authDomain: "hu-registrar-a915c.firebaseapp.com",
            projectId: "hu-registrar-a915c",
            storageBucket: "hu-registrar-a915c.firebasestorage.app",
            messagingSenderId: "335596409610",
            appId: "1:335596409610:web:01367dd58f9dcb64bb20f3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let selectedStudentId = null;
        let globalConfig = null;

        // Auth Logic
        window.handleLogin = async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { alert("Login Failed"); }
        };
        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                initSync(user.email);
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        async function initSync(email) {
            // Fetch User Role
            const qU = query(collection(db, "users"), where("email", "==", email));
            const userSnap = await getDocs(qU);
            if (!userSnap.empty) {
                const role = userSnap.docs[0].data().userRoles[0];
                document.getElementById('roleBadge').innerText = role;
                const isAdmin = role === "Admin";
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = isAdmin ? 'flex' : 'none');
                document.querySelectorAll('.staff-only').forEach(el => el.style.display = 'flex');
            }

            // Sync Config
            onSnapshot(doc(db, "config", "general"), snap => {
                if (snap.exists()) {
                    globalConfig = snap.data();
                    fillSelect('dropDept', globalConfig.departments);
                    fillSelect('dropModality', globalConfig.studymodalitys);
                    fillSelect('moveRole', globalConfig.roles);
                    fillSelect('moveOffice', globalConfig.rooms);
                    
                    // Fill services for registration
                    const sContainer = document.getElementById('regServices');
                    sContainer.innerHTML = '<h4>Services</h4>';
                    globalConfig.services.forEach(s => {
                        sContainer.innerHTML += `<label><input type="checkbox" value="${s}" class="reg-svc"> ${s}</label><br>`;
                    });
                }
            });

            // Sync Students
            onSnapshot(query(collection(db, "students"), orderBy("createdAt", "desc")), snap => {
                const tbody = document.querySelector("#studentTbl tbody");
                tbody.innerHTML = "";
                snap.forEach(d => {
                    const s = d.data();
                    tbody.innerHTML += `<tr>
                        <td class="student-name" onclick="openStudentModal('${d.id}')">${s.name}</td>
                        <td>${s.department}</td>
                        <td><span class="badge">${s.currentStatus}</span></td>
                        <td>${s.currentOffice || 'N/A'}</td>
                        <td style="font-size:10px;">${(s.services || []).join(', ')}</td>
                    </tr>`;
                });
            });
        }

        window.openStudentModal = async (id) => {
            selectedStudentId = id;
            const snap = await getDocs(query(collection(db, "students")));
            const student = snap.docs.find(d => d.id === id).data();
            
            document.getElementById('modalStudentName').innerText = student.name;
            document.getElementById('historyLog').innerHTML = student.history.map(h => `<div><b>${h.status}</b>: ${h.office || ''} (${h.time})</div>`).join('');
            
            // Build service checkboxes
            const svcDiv = document.getElementById('serviceCheckboxes');
            svcDiv.innerHTML = "";
            globalConfig.services.forEach(s => {
                const checked = student.services && student.services.includes(s) ? 'checked' : '';
                svcDiv.innerHTML += `<label><input type="checkbox" value="${s}" class="modal-svc" ${checked}> ${s}</label><br>`;
            });

            document.getElementById('studentModal').style.display = 'flex';
        };

        window.saveStudentUpdate = async () => {
            const nextStatus = document.getElementById('moveRole').value;
            const nextOffice = document.getElementById('moveOffice').value;
            const selectedServices = Array.from(document.querySelectorAll('.modal-svc:checked')).map(el => el.value);

            await updateDoc(doc(db, "students", selectedStudentId), {
                currentStatus: nextStatus,
                currentOffice: nextOffice,
                services: selectedServices,
                history: arrayUnion({
                    status: nextStatus,
                    office: nextOffice,
                    time: new Date().toLocaleString(),
                    user: auth.currentUser.email
                })
            });
            alert("Updated Successfully!");
            closeModal();
        };

        window.registerStudent = async () => {
            const svcs = Array.from(document.querySelectorAll('.reg-svc:checked')).map(el => el.value);
            await addDoc(collection(db, "students"), {
                name: document.getElementById('sName').value,
                department: document.getElementById('dropDept').value,
                modality: document.getElementById('dropModality').value,
                services: svcs,
                currentStatus: "Registered",
                currentOffice: "Admission",
                createdAt: new Date(),
                history: [{status: "Registered", office: "Admission", time: new Date().toLocaleString(), user: auth.currentUser.email}]
            });
            alert("Student Registered!");
        };

        window.closeModal = () => document.getElementById('studentModal').style.display = 'none';
        function fillSelect(id, arr) {
            const el = document.getElementById(id);
            if(el && arr) el.innerHTML = arr.map(x => `<option value="${x}">${x}</option>`).join('');
        }
        window.showView = (v, el) => {
            document.querySelectorAll('.view-section').forEach(x => x.classList.remove('active'));
            document.getElementById(v + 'View').classList.add('active');
            document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        };
    </script>
</body>
</html>
