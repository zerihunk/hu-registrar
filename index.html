<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HU Registrar | Full Firebase Suite</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --bg: #f4f7fa;
            --sidebar: #1a252f; --success: #27ae60; --danger: #e74c3c;
            --border: #e1e8ed;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .brand { padding: 25px; font-size: 1.4rem; font-weight: bold; color: var(--accent); border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .nav { padding: 15px 25px; cursor: pointer; color: #95a5a6; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .nav:hover { color: white; background: rgba(255,255,255,0.1); }
        .nav.active { color: white; background: rgba(255,255,255,0.05); border-left: 4px solid var(--accent); }
        .main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 70px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
        .content { padding: 30px; overflow-y: auto; flex-grow: 1; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #f8f9fa; color: #7f8c8d; font-size: 0.85rem; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #e1f5fe; color: #03a9f4; }
        #loginScreen { position: fixed; inset: 0; background: var(--sidebar); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        #mainApp { display: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="card" style="width: 350px;">
            <h2 style="text-align: center;">HU Registrar</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="pass" placeholder="Password">
            <button style="width: 100%;" onclick="login()">Sign In</button>
        </div>
    </div>

    <div id="mainApp">
        <div class="sidebar">
            <div class="brand">HU Admin</div>
            <div class="nav active" onclick="show('dash', this)">Dashboard</div>
            <div id="regNav" class="nav" onclick="show('reg', this)">Register Student</div>
            <div id="staffNav" class="nav" style="display:none;" onclick="show('staff', this)">Staff Manager</div>
            <div id="sysNav" class="nav" style="display:none;" onclick="show('sys', this)">System Settings</div>
            <div style="margin-top: auto;" class="nav" onclick="logout()">Logout</div>
        </div>

        <div class="main">
            <div class="header">
                <div id="userInfo" style="font-weight: bold;">Loading...</div>
                <div id="roleBox" class="badge">Role: Guest</div>
            </div>

            <div class="content">
                <div id="dashView" class="view">
                    <div class="card">
                        <h3>Workflow Dashboard</h3>
                        <table>
                            <thead><tr><th>Name</th><th>Dept</th><th>Status</th><th>Action</th></tr></thead>
                            <tbody id="tbl"></tbody>
                        </table>
                    </div>
                </div>

                <div id="regView" class="view" style="display:none;">
                    <div class="card" style="max-width: 500px;">
                        <h3>New Registration</h3>
                        <input id="inName" placeholder="Full Name">
                        <input id="inDept" placeholder="Department">
                        <button onclick="addStudent()">Save</button>
                    </div>
                </div>

                <div id="staffView" class="view" style="display:none;">
                    <div class="card">
                        <h3>Staff Management</h3>
                        <p>አዳዲስ ሰራተኞችን እዚህ ማስተዳደር ትችላለህ።</p>
                    </div>
                </div>

                <div id="sysView" class="view" style="display:none;">
                    <div class="card">
                        <h3>System Configuration</h3>
                        <p>የሲስተም ሴቲንግ ማስተካከያ።</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLFipN6v4UCa4D429-J7N4BidGgPXSazY",
            authDomain: "hu-registrar-a915c.firebaseapp.com",
            projectId: "hu-registrar-a915c",
            storageBucket: "hu-registrar-a915c.firebasestorage.app",
            messagingSenderId: "335596409610",
            appId: "1:335596409610:web:01367dd58f9dcb64bb20f3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserRoles = [];

        window.login = async () => {
            try {
                await signInWithEmailAndPassword(auth, email.value, pass.value);
            } catch (err) { alert(err.message); }
        };

        window.logout = () => signOut(auth);

        async function fetchRole(uid) {
            const docRef = doc(db, "users", uid);
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                const data = snap.data();
                currentUserRoles = data.userRoles || [];
                const primaryRole = currentUserRoles[0] || "Guest";
                
                document.getElementById('roleBox').innerText = "Role: " + primaryRole;

                // Admin ከሆንክ ሁሉንም ሜኑዎች አሳይ
                if (currentUserRoles.includes("Admin")) {
                    document.getElementById('staffNav').style.display = 'flex';
                    document.getElementById('sysNav').style.display = 'flex';
                    document.getElementById('regNav').style.display = 'flex';
                } else if (currentUserRoles.includes("Admission")) {
                    document.getElementById('regNav').style.display = 'flex';
                }
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                document.getElementById('userInfo').innerText = user.email;
                await fetchRole(user.uid);
                loadData();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        function loadData() {
            onSnapshot(collection(db, "students"), (snap) => {
                const students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render(students);
            });
        }

        window.addStudent = async () => {
            await addDoc(collection(db, "students"), {
                name: inName.value, dept: inDept.value, step: "Registered"
            });
            show('dash', document.querySelector('.nav'));
        };

        function render(data) {
            const steps = ["Registered", "Admission", "Finance", "Registrar", "Completed"];
            tbl.innerHTML = data.map(s => `
                <tr>
                    <td><b>${s.name}</b></td>
                    <td>${s.dept}</td>
                    <td><span class="badge">${s.step}</span></td>
                    <td>
                        <select onchange="updateStep('${s.id}', this.value)">
                            ${steps.map(st => `<option ${s.step===st?'selected':''}>${st}</option>`).join('')}
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        window.updateStep = async (id, next) => {
            await updateDoc(doc(db, "students", id), { step: next });
        };

        window.show = (v, el) => {
            document.querySelectorAll('.view').forEach(x => x.style.display = 'none');
            document.getElementById(v + 'View').style.display = 'block';
            document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        };
    </script>
</body>
</html>
