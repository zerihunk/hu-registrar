<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HU Registrar Firebase</title>

<style>
body{
    font-family:Arial;
    background:#f4f6f9;
    margin:0;
    padding:0;
}

.header{
    background:#2c3e50;
    color:white;
    padding:15px;
    font-size:24px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input,select{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

#mainApp{
    display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="container">
    <div class="card" style="max-width:400px;margin:auto;margin-top:100px;">
        <h2>HU Registrar Login</h2>

        <input type="email" id="lUser" placeholder="Email">
        <input type="password" id="lPass" placeholder="Password">

        <button onclick="doLogin()">Login</button>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp">

    <div class="header">
        HU Registrar System
        <button onclick="logout()" style="float:right;background:red;">
            Logout
        </button>
    </div>

    <div class="container">

        <div class="card">
            <h3>Register Student</h3>

            <input type="text" id="inName" placeholder="Student Name">
            <input type="text" id="inDept" placeholder="Department">

            <select id="inDeg">
                <option>Degree</option>
                <option>Masters</option>
                <option>PhD</option>
            </select>

            <select id="inMod">
                <option>Regular</option>
                <option>Summer</option>
                <option>Weekend</option>
            </select>

            <input type="date" id="inDate">

            <button onclick="saveNewReq()">
                Save Student
            </button>
        </div>

        <div class="card">
            <h3>Student Requests</h3>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Degree</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="dashTable"></tbody>
            </table>
        </div>

    </div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDLFipN6v4UCa4D429-J7N4BidGgPXSazY",
  authDomain: "hu-registrar-a915c.firebaseapp.com",
  projectId: "hu-registrar-a915c",
  storageBucket: "hu-registrar-a915c.firebasestorage.app",
  messagingSenderId: "335596409610",
  appId: "1:335596409610:web:01367dd58f9dcb64bb20f3"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

let reqs = [];

window.doLogin = async function(){

    const email = document.getElementById('lUser').value;

    const pass = document.getElementById('lPass').value;

    try{

        await signInWithEmailAndPassword(auth,email,pass);

    }catch(e){

        alert(e.message);

    }

};

window.logout = function(){

    signOut(auth);

};

onAuthStateChanged(auth,(user)=>{

    if(user){

        document.getElementById('loginScreen').style.display='none';

        document.getElementById('mainApp').style.display='block';

        loadRequests();

    }else{

        document.getElementById('loginScreen').style.display='block';

        document.getElementById('mainApp').style.display='none';

    }

});

async function loadRequests(){

    onSnapshot(collection(db,"requests"),(snap)=>{

        reqs = snap.docs.map(doc=>doc.data());

        render();

    });

}

window.saveNewReq = async function(){

    const name = document.getElementById('inName').value;

    if(!name){

        alert("Enter name");

        return;

    }

    await addDoc(collection(db,"requests"),{

        name:name,
        dept:document.getElementById('inDept').value,
        deg:document.getElementById('inDeg').value,
        mod:document.getElementById('inMod').value,
        date:document.getElementById('inDate').value,
        step:"Registered"

    });

    alert("Saved");

};

function render(){

    document.getElementById('dashTable').innerHTML = reqs.map(r=>`

        <tr>
            <td>${r.name}</td>
            <td>${r.dept}</td>
            <td>${r.deg}</td>
            <td>${r.step}</td>
        </tr>

    `).join('');

}

</script>

</body>
</html>
