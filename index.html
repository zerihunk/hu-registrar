<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HU Registrar - Firebase Shared System</title>
<style>
:root{
  --primary:#2c3e50; --accent:#3498db; --bg:#f4f6f9;
  --sidebar:#1a252f; --success:#27ae60; --danger:#e74c3c;
}
body{ margin:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:var(--bg); display:flex; height:100vh; overflow: hidden; }
.sidebar{ width:240px; background:var(--sidebar); color:white; display:flex; flex-direction:column; }
.brand{ padding:20px; font-weight:bold; color:var(--accent); border-bottom:1px solid rgba(255,255,255,0.1); font-size: 1.2rem; }
.nav{ padding:15px 20px; cursor:pointer; color:#aaa; transition: 0.3s; }
.nav:hover{ color:white; background:rgba(255,255,255,0.1); }
.nav.active{ color:white; border-left: 4px solid var(--accent); background:rgba(255,255,255,0.05); }
.main{ flex:1; display:flex; flex-direction:column; }
.header{ background:white; padding:12px 25px; display:flex; justify-content:space-between; align-items: center; border-bottom:1px solid #ddd; }
.content{ padding:25px; overflow-y:auto; flex: 1; }
.card{ background:white; padding:20px; border-radius:10px; margin-bottom:20px; box-shadow:0 4px 6px rgba(0,0,0,0.05); }
input, select{ width:100%; padding:12px; margin-top:10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
button{ padding:12px 20px; background:var(--accent); color:white; border:none; border-radius: 5px; cursor:pointer; margin-top:15px; font-weight: bold; }
button:hover{ opacity: 0.9; }
table{ width:100%; border-collapse:collapse; background: white; }
th, td{ padding:15px; border-bottom:1px solid #eee; text-align: left; }
th{ color: #7f8c8d; font-size: 0.85rem; text-transform: uppercase; }
#loginScreen{ position: fixed; inset: 0; background: var(--sidebar); z-index: 1000; display: flex; align-items: center; justify-content: center; }
#mainApp{ display:none; width: 100%; height: 100%; }
.badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
.badge-info { background: #e1f5fe; color: #03a9f4; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="card" style="width:350px;">
    <h2 style="text-align: center; color: var(--primary);">HU Registrar</h2>
    <p style="text-align: center; color: #666;">Sign in to continue</p>
    <input id="loginEmail" type="email" placeholder="Email Address">
    <input id="loginPass" type="password" placeholder="Password">
    <button style="width: 100%;" onclick="login()">Sign In</button>
  </div>
</div>

<div id="mainApp">
  <div class="sidebar">
    <div class="brand">HU Registrar Pro</div>
    <div class="nav active" onclick="show('dash', this)">Dashboard</div>
    <div id="regNav" class="nav" onclick="show('reg', this)">Register Student</div>
  </div>

  <div class="main">
    <div class="header">
      <div style="font-weight: bold; color: var(--primary);" id="welcomeUser">Welcome</div>
      <div id="roleBox" class="badge badge-info">Role: Loading...</div>
      <button style="margin:0; background: var(--danger);" onclick="logout()">Logout</button>
    </div>

    <div class="content">
      <div id="dashView">
        <div class="card">
          <h3>Student Workflow Management</h3>
          <table>
            <thead>
              <tr>
                <th>Student Name</th>
                <th>Department</th>
                <th>Degree</th>
                <th>Status</th>
                <th>Workflow Action</th>
              </tr>
            </thead>
            <tbody id="tbl"></tbody>
          </table>
        </div>
      </div>

      <div id="regView" style="display:none;">
        <div class="card" style="max-width: 500px;">
          <h3>New Student Registration</h3>
          <input id="sName" placeholder="Full Name">
          <input id="sDept" placeholder="Department">
          <select id="sDeg">
            <option value="Degree">Degree</option>
            <option value="Masters">Masters</option>
            <option value="PhD">PhD</option>
          </select>
          <button onclick="addStudent()">Register & Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// --- ማሳሰቢያ፦ እዚህ ጋር የራስህን የFirebase Config ኮድ መተካት አለብህ ---
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let students = [];
let currentUserRole = "Guest";

// LOGIN
window.login = async () => {
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) { 
    alert("Login Error: " + e.message); 
  }
};

window.logout = () => signOut(auth);

// ROLE LOGIC
async function loadRole(uid) {
  const ref = doc(db, "users", uid);
  try {
    const snap = await getDoc(ref);
    if(snap.exists()){
      currentUserRole = snap.data().role;
      document.getElementById('roleBox').innerText = "Role: " + currentUserRole;
      // Admin ካልሆነ የክፍያ ወይም የሌላ ክፍል ሰው ተማሪ እንዳይመዘግብ መከልከል ከፈለግክ፡
      document.getElementById('regNav').style.display = (currentUserRole === 'Admission' || currentUserRole === 'Admin') ? 'block' : 'none';
    } else {
      currentUserRole = "Guest";
      document.getElementById('roleBox').innerText = "Role: Guest";
    }
  } catch(e) {
    console.error("Error loading role:", e);
  }
}

// AUTH STATE CHANGE
onAuthStateChanged(auth, async (u) => {
  if(u){
    document.getElementById('loginScreen').style.display = "none";
    document.getElementById('mainApp').style.display = "flex";
    document.getElementById('welcomeUser').innerText = "User: " + u.email;
    await loadRole(u.uid);
    startListening();
  } else {
    document.getElementById('loginScreen').style.display = "flex";
    document.getElementById('mainApp').style.display = "none";
  }
});

// ADD STUDENT
window.addStudent = async () => {
  const name = document.getElementById('sName').value;
  const dept = document.getElementById('sDept').value;
  const deg = document.getElementById('sDeg').value;

  if(!name || !dept) return alert("Please fill all fields");

  try {
    await addDoc(collection(db, "students"), {
      name: name,
      dept: dept,
      deg: deg,
      step: "Registered",
      createdAt: new Date().toISOString()
    });
    alert("Student Registered!");
    document.getElementById('sName').value = "";
    document.getElementById('sDept').value = "";
    window.show('dash', document.querySelector('.nav'));
  } catch(e) {
    alert("Error: " + e.message);
  }
};

// FETCH DATA
function startListening() {
  onSnapshot(collection(db, "students"), (snap) => {
    students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

// PERMISSIONS
function canChange(step) {
  if(currentUserRole === "Admin") return true;
  if(currentUserRole === "Admission" && step === "Registered") return true;
  if(currentUserRole === "Finance" && step === "Admission") return true;
  if(currentUserRole === "Registrar" && step === "Finance") return true;
  return false;
}

window.updateStep = async (id, newStep, currentStep) => {
  if(!canChange(currentStep)) {
    alert("Permission Denied: Your role (" + currentUserRole + ") cannot process students at the '" + currentStep + "' stage.");
    render(); // Reset select UI
    return;
  }
  const ref = doc(db, "students", id);
  await updateDoc(ref, { step: newStep });
};

// RENDER UI
function render() {
  const tbl = document.getElementById('tbl');
  tbl.innerHTML = students.map(s => {
    let disabled = !canChange(s.step);
    const steps = ["Registered", "Admission", "Finance", "Registrar", "Completed"];
    
    return `
    <tr>
      <td><strong>${s.name}</strong></td>
      <td>${s.dept}</td>
      <td>${s.deg}</td>
      <td><span class="badge badge-info">${s.step}</span></td>
      <td>
        <select ${disabled ? 'disabled' : ''} onchange="updateStep('${s.id}', this.value, '${s.step}')">
          ${steps.map(st => `<option value="${st}" ${s.step === st ? 'selected' : ''}>${st}</option>`).join('')}
        </select>
      </td>
    </tr>`;
  }).join("");
}

// NAVIGATION
window.show = (view, el) => {
  document.getElementById('dashView').style.display = view === 'dash' ? 'block' : 'none';
  document.getElementById('regView').style.display = view === 'reg' ? 'block' : 'none';
  
  document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));
  if(el) el.classList.add('active');
};

</script>
</body>
</html>
