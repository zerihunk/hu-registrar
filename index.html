<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HU Registrar | Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a252f; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 350px; }
        h2 { text-align: center; color: #1a252f; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>HU Cloud Login</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLFipN6v4UCa4D429-J7N4BidGgPXSazY",
            authDomain: "hu-registrar-a915c.firebaseapp.com",
            projectId: "hu-registrar-a915c",
            storageBucket: "hu-registrar-a915c.firebasestorage.app",
            messagingSenderId: "335596409610",
            appId: "1:335596409610:web:01367dd58f9dcb64bb20f3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                // ሎጊን ካደረገ በኋላ ወደ index.html እንዲሄድ:
                window.location.href = "index.html";
            } catch (err) {
                alert("Login Failed: " + err.message);
            }
        };
    </script>
</body>
</html>
