<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HU Registrar</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f7fa;
}

.header{
    background:#2c3e50;
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input,select{
    width:100%;
    padding:10px;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    padding:10px 15px;
    border:none;
    background:#3498db;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border-bottom:1px solid #ddd;
    padding:10px;
    text-align:left;
}

#loginScreen{
    position:fixed;
    inset:0;
    background:#1a252f;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.login-box{
    background:white;
    width:320px;
    padding:40px;
    border-radius:15px;
}

.row-complete{
    background:#e8f5e9;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="login-box">

        <h2>HU Registrar Login</h2>

        <input type="email" id="lUser" placeholder="Email">

        <input type="password" id="lPass" placeholder="Password">

        <button style="width:100%;margin-top:15px;" onclick="doLogin()">
            Login
        </button>

    </div>

</div>

<!-- MAIN -->

<div class="header">
    <h2>HU Registrar System</h2>

    <button onclick="logout()">Logout</button>
</div>

<div class="container">

    <!-- ADD STUDENT -->

    <div class="card">

        <h3>Register Student</h3>

        <input type="text" id="inName" placeholder="Student Name">

        <input type="text" id="inDept" placeholder="Department">

        <select id="inDeg">
            <option value="">Degree Type</option>
            <option>Degree</option>
            <option>Masters</option>
            <option>PhD</option>
        </select>

        <select id="inMod">
            <option value="">Modality</option>
            <option>Regular</option>
            <option>Summer</option>
            <option>Weekend</option>
        </select>

        <input type="date" id="inDate">

        <button style="margin-top:15px;" onclick="saveNewReq()">
            Save Student
        </button>

    </div>

    <!-- TABLE -->

    <div class="card">

        <h3>Requests</h3>

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Degree</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="dashTable"></tbody>

        </table>

    </div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyDLFipN6v4UCa4D429-J7N4BidGgPXSazY",
  authDomain: "hu-registrar-a915c.firebaseapp.com",
  projectId: "hu-registrar-a915c",
  storageBucket: "hu-registrar-a915c.firebasestorage.app",
  messagingSenderId: "335596409610",
  appId: "1:335596409610:web:01367dd58f9dcb64bb20f3"
};

/* INIT */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

/* STATE */

let config = {
    services: [],
    roles: [],
    rooms: []
};

let users = [];

let reqs = [];

let currentUser = null;

let tmpS = [];

let tmpR = [];

/* LOGIN */

window.doLogin = async ()=>{

    const email = document.getElementById('lUser').value;

    const pass = document.getElementById('lPass').value;

    try{

        await signInWithEmailAndPassword(auth,email,pass);

    }catch(e){

        alert(e.message);
    }
};

/* LOGOUT */

window.logout = ()=>{

    signOut(auth);
};

/* AUTH STATE */

onAuthStateChanged(auth, async(user)=>{

    if(user){

        document.getElementById('loginScreen').style.display='none';

        const snap = await getDocs(collection(db,"users"));

        users = snap.docs.map(d=>({
            id:d.id,
            ...d.data()
        }));

        currentUser = users.find(u=>u.email===user.email);

        if(!currentUser){

            alert("User not registered in Firestore");

            return;
        }

        loadAll();

    }else{

        document.getElementById('loginScreen').style.display='flex';
    }
});

/* LOAD */

async function loadAll(){

    const cfg = await getDocs(collection(db,"config"));

    config = cfg.docs[0]?.data() || config;

    onSnapshot(collection(db,"requests"),(snap)=>{

        reqs = snap.docs.map(d=>({
            id:d.id,
            ...d.data()
        }));

        render();
    });
}

/* SAVE REQUEST */

window.saveNewReq = async ()=>{

    const n = document.getElementById('inName').value;

    if(!n){

        alert("Enter name");

        return;
    }

    await addDoc(collection(db,"requests"),{

        name:n,

        dept:document.getElementById('inDept').value,

        deg:document.getElementById('inDeg').value,

        mod:document.getElementById('inMod').value,

        date:document.getElementById('inDate').value,

        step:"Pending"

    });

    alert("Saved");
};

/* DELETE */

window.delReq = async(i)=>{

    if(confirm("Delete?")){

        await deleteDoc(doc(db,"requests",reqs[i].id));
    }
};

/* RENDER */

function render(){

    document.getElementById('dashTable').innerHTML = reqs.map((r,i)=>`

        <tr class="${r.step==='COMPLETE'?'row-complete':''}">

            <td>${r.name || ''}</td>

            <td>${r.dept || ''}</td>

            <td>${r.deg || ''}</td>

            <td>${r.step || ''}</td>

            <td>

                <button onclick="delReq(${i})">
                    Delete
                </button>

            </td>

        </tr>

    `).join('');
}

</script>

</body>
</html>
