<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HU Registrar Firebase</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    padding:15px;
    font-size:24px;
}

.container{ padding:20px; }

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input,select{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    padding:10px 15px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{ opacity:0.9; }

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

#mainApp{ display:none; }

.login-box{
    width:350px;
    margin:auto;
    margin-top:100px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
    <div class="login-box card">
        <h2>HU Registrar Login</h2>

        <input type="email" id="lUser" placeholder="Email">
        <input type="password" id="lPass" placeholder="Password">

        <button onclick="doLogin()">Login</button>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp">

    <div class="header">
        HU Registrar System
        <button onclick="logout()" style="float:right;background:red;">
            Logout
        </button>
    </div>

    <div class="container">

        <!-- REGISTER -->
        <div class="card">
            <h3>Register Student</h3>

            <input type="text" id="inName" placeholder="Student Name">
            <input type="text" id="inDept" placeholder="Department">

            <select id="inDeg">
                <option>Degree</option>
                <option>Masters</option>
                <option>PhD</option>
            </select>

            <select id="inMod">
                <option>Regular</option>
                <option>Summer</option>
                <option>Weekend</option>
            </select>

            <input type="date" id="inDate">

            <button onclick="saveNewReq()">Save Student</button>
        </div>

        <!-- TABLE -->
        <div class="card">
            <h3>Student Requests</h3>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Degree</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="dashTable"></tbody>
            </table>
        </div>

    </div>
</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDLFipN6v4UCa4D429-J7N4BidGgPXSazY",
    authDomain: "hu-registrar-a915c.firebaseapp.com",
    projectId: "hu-registrar-a915c",
    storageBucket: "hu-registrar-a915c.appspot.com",
    messagingSenderId: "335596409610",
    appId: "1:335596409610:web:01367dd58f9dcb64bb20f3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let reqs = [];

/* LOGIN */
window.doLogin = async function () {
    const email = document.getElementById("lUser").value;
    const pass = document.getElementById("lPass").value;

    try {
        await signInWithEmailAndPassword(auth, email, pass);
    } catch (error) {
        console.log(error.code, error.message);
        alert(error.message);
    }
};

/* LOGOUT */
window.logout = function () {
    signOut(auth);
};

/* AUTH STATE (FIXED) */
document.addEventListener("DOMContentLoaded", () => {

    onAuthStateChanged(auth, (user) => {

        const loginScreen = document.getElementById("loginScreen");
        const mainApp = document.getElementById("mainApp");

        if (!loginScreen || !mainApp) {
            console.error("Missing HTML elements");
            return;
        }

        if (user) {
            loginScreen.style.display = "none";
            mainApp.style.display = "block";
            loadRequests();
        } else {
            loginScreen.style.display = "block";
            mainApp.style.display = "none";
        }
    });

});

/* LOAD DATA */
function loadRequests() {
    onSnapshot(collection(db, "requests"), (snapshot) => {
        reqs = snapshot.docs.map(doc => doc.data());
        render();
    });
}

/* SAVE */
window.saveNewReq = async function () {

    const name = document.getElementById("inName").value;

    if (!name) {
        alert("Please enter student name");
        return;
    }

    await addDoc(collection(db, "requests"), {
        name,
        dept: document.getElementById("inDept").value,
        deg: document.getElementById("inDeg").value,
        mod: document.getElementById("inMod").value,
        date: document.getElementById("inDate").value,
        step: "Registered"
    });

    alert("Student Saved");
};

/* RENDER */
function render() {
    document.getElementById("dashTable").innerHTML =
        reqs.map(r => `
            <tr>
                <td>${r.name}</td>
                <td>${r.dept}</td>
                <td>${r.deg}</td>
                <td>${r.step}</td>
            </tr>
        `).join("");
}

</script>

</body>
</html>
