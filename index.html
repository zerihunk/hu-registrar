<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HU Registrar Full Workflow Firebase + Roles</title>

<style>
:root{
  --primary:#2c3e50;
  --accent:#3498db;
  --bg:#f4f6f9;
  --sidebar:#1a252f;
  --success:#27ae60;
  --danger:#e74c3c;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  display:flex;
  height:100vh;
}

.sidebar{
  width:240px;
  background:var(--sidebar);
  color:white;
  display:flex;
  flex-direction:column;
}

.brand{
  padding:18px;
  font-weight:bold;
  color:var(--accent);
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.nav{
  padding:14px;
  cursor:pointer;
  color:#aaa;
}

.nav:hover{color:white;background:rgba(255,255,255,0.05)}

.main{flex:1;display:flex;flex-direction:column;}

.header{
  background:white;
  padding:12px 18px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
}

.content{padding:20px;overflow:auto;}

.card{
  background:white;
  padding:18px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input,select{width:100%;padding:10px;margin-top:8px;}
button{padding:10px;background:var(--accent);color:white;border:none;cursor:pointer;margin-top:10px;}

table{width:100%;border-collapse:collapse;}
th,td{padding:10px;border-bottom:1px solid #eee;font-size:14px;}

#mainApp{display:none;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" style="width:100%;display:flex;align-items:center;justify-content:center;">
  <div class="card" style="width:320px;">
    <h3>Login</h3>
    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="mainApp" style="width:100%;display:flex;">

<div class="sidebar">
  <div class="brand">HU Registrar</div>
  <div class="nav" onclick="show('dash')">Dashboard</div>
  <div class="nav" onclick="show('reg')">Register</div>
</div>

<div class="main">

<div class="header">
  <div>Full Workflow + Roles</div>
  <div id="roleBox"></div>
  <button onclick="logout()">Logout</button>
</div>

<div class="content">

<div id="dash">
<div class="card">
<h3>Students Workflow</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Dept</th>
<th>Degree</th>
<th>Step</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tbl"></tbody>
</table>
</div>
</div>

<div id="reg" style="display:none;">
<div class="card">
<h3>Register Student</h3>
<input id="name" placeholder="Name">
<input id="dept" placeholder="Dept">
<select id="deg">
<option>Degree</option>
<option>Masters</option>
<option>PhD</option>
</select>
<button onclick="addStudent()">Save</button>
</div>
</div>

</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"YOUR_KEY",
  authDomain:"YOUR_DOMAIN",
  projectId:"YOUR_PROJECT",
  appId:"YOUR_APP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let students=[];
let currentUserRole="Guest";

/* LOGIN */
window.login = async ()=>{
  try{
    await signInWithEmailAndPassword(auth,email.value,pass.value);
  }catch(e){alert(e.message)}
}

window.logout=()=>signOut(auth);

/* GET ROLE */
async function loadRole(uid){
  const ref = doc(db,"users",uid);
  const snap = await getDoc(ref);
  if(snap.exists()){
    currentUserRole = snap.data().role;
    roleBox.innerText = "Role: " + currentUserRole;
  }else{
    currentUserRole="Guest";
  }
}

onAuthStateChanged(auth,async u=>{
  if(u){
    loginScreen.style.display="none";
    mainApp.style.display="flex";
    await loadRole(u.uid);
    load();
  }else{
    loginScreen.style.display="flex";
    mainApp.style.display="none";
  }
});

/* ADD */
window.addStudent = async ()=>{
  await addDoc(collection(db,"students"),{
    name:name.value,
    dept:dept.value,
    deg:deg.value,
    step:"Registered"
  });
}

/* LOAD */
function load(){
  onSnapshot(collection(db,"students"),snap=>{
    students=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
}

/* ROLE PERMISSIONS */
function canChange(step){
  if(currentUserRole==="Admin") return true;
  if(currentUserRole==="Admission" && step==="Registered") return true;
  if(currentUserRole==="Finance" && step==="Admission") return true;
  if(currentUserRole==="Registrar" && step==="Finance") return true;
  return false;
}

window.updateStep = async (id,newStep,currentStep)=>{
  if(!canChange(currentStep)) return alert("Not allowed for your role");
  const ref = doc(db,"students",id);
  await updateDoc(ref,{step:newStep});
}

/* RENDER */
function render(){
  tbl.innerHTML = students.map(s=>{

    let disabled = !canChange(s.step);

    return `
    <tr>
      <td>${s.name}</td>
      <td>${s.dept}</td>
      <td>${s.deg}</td>
      <td>${s.step}</td>
      <td>
        <select ${disabled?'disabled':''} onchange="updateStep('${s.id}',this.value,'${s.step}')">
          <option>Registered</option>
          <option>Admission</option>
          <option>Finance</option>
          <option>Registrar</option>
          <option>Completed</option>
        </select>
      </td>
    </tr>`;
  }).join("");
}

window.show=(x)=>{
  dash.style.display=x==='dash'?'block':'none';
  reg.style.display=x==='reg'?'block':'none';
}

</script>

</body>
</html>

<!-- FIRESTORE RULES (IMPORTANT)

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    match /students/{id} {
      allow read: if true;
      allow write: if request.auth != null;
    }

    match /users/{uid} {
      allow read: if request.auth != null && request.auth.uid == uid;
    }
  }
}
-->
