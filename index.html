<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HU Registrar | Unified System</title>
    <style>
        :root { --primary: #1a252f; --accent: #3498db; --bg: #f4f7fa; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); height: 100vh; display: flex; }
        
        /* Login Screen Styles */
        #loginOverlay { position: fixed; inset: 0; background: #1a252f; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 320px; text-align: center; }
        
        /* Main App Styles */
        #mainApp { display: none; width: 100%; height: 100%; }
        .sidebar { width: 250px; background: var(--primary); color: white; display: flex; flex-direction: column; }
        .nav { padding: 15px 20px; cursor: pointer; color: #95a5a6; border-left: 4px solid transparent; }
        .nav.active { background: rgba(255,255,255,0.1); color: white; border-left-color: var(--accent); }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 60px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .content-area { padding: 20px; overflow-y: auto; flex-grow: 1; }
        
        /* UI Components */
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>HU Registrar</h2>
            <p>Please Sign In</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
        </div>
    </div>

    <div id="mainApp">
        <div class="sidebar">
            <div style="padding: 20px; font-weight: bold; color: var(--accent);">HU CLOUD SYSTEM</div>
            <div class="nav active" onclick="showView('dash', this)">Dashboard</div>
            <div class="nav" onclick="showView('reg', this)">Registration</div>
            <div class="nav" onclick="showView('sys', this)">System Config</div>
            <div class="nav" onclick="handleLogout()" style="margin-top:auto;">Logout</div>
        </div>

        <div class="main-content">
            <div class="header">
                <div id="userEmailDisplay">Loading User...</div>
                <div style="color: green; font-weight: bold;">● Online</div>
            </div>

            <div class="content-area">
                <div id="dashView" class="view-section active">
                    <div class="card">
                        <h3>Registered Students (Live)</h3>
                        <table>
                            <thead>
                                <tr><th>Name</th><th>Service</th><th>Status</th><th>History Log</th></tr>
                            </thead>
                            <tbody id="studentList"></tbody>
                        </table>
                    </div>
                </div>

                <div id="regView" class="view-section">
                    <div class="card" style="max-width: 400px;">
                        <h3>Register Student</h3>
                        <input type="text" id="sName" placeholder="Full Name">
                        <input type="date" id="sDate">
                        <select id="dropMod"></select>
                        <select id="dropServ"></select>
                        <button onclick="addStudent()">Save Student</button>
                    </div>
                </div>

                <div id="sysView" class="view-section">
                    <div class="card">
                        <h3>Configuration Data</h3>
                        <div id="configInfo">Syncing with config/general...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLFipN6v4UCa4D429-J7N4BidGgPXSazY",
            authDomain: "hu-registrar-a915c.firebaseapp.com",
            projectId: "hu-registrar-a915c",
            storageBucket: "hu-registrar-a915c.firebasestorage.app",
            messagingSenderId: "335596409610",
            appId: "1:335596409610:web:01367dd58f9dcb64bb20f3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userEmail = "";

        // --- AUTH SECTION ---
        window.handleLogin = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try {
                await signInWithEmailAndPassword(auth, e, p);
            } catch (err) {
                alert("Login Error: " + err.message);
            }
        };

        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userEmail = user.email;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                document.getElementById('userEmailDisplay').innerText = user.email;
                initData();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        // --- DATA SECTION ---
        function initData() {
            // Dashboard Sync
            const q = query(collection(db, "students"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('studentList');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const s = doc.data();
                    const logs = s.history.map(h => `• ${h.status}`).join('<br>');
                    list.innerHTML += `<tr>
                        <td><b>${s.name}</b></td>
                        <td>${s.service}</td>
                        <td>${s.currentStatus}</td>
                        <td style="font-size:11px;">${logs}</td>
                    </tr>`;
                });
            });

            // Config Sync
            onSnapshot(doc(db, "config", "general"), (snap) => {
                if(snap.exists()) {
                    const d = snap.data();
                    document.getElementById('dropMod').innerHTML = d.studymodalitys.map(x => `<option>${x}</option>`).join('');
                    document.getElementById('dropServ').innerHTML = d.services.map(x => `<option>${x}</option>`).join('');
                }
            });
        }

        window.addStudent = async () => {
            await addDoc(collection(db, "students"), {
                name: document.getElementById('sName').value,
                service: document.getElementById('dropServ').value,
                currentStatus: "Registered",
                createdAt: new Date(),
                history: [{status: "Registered", time: new Date().toLocaleString()}]
            });
            alert("Saved!");
            showView('dash');
        };

        window.showView = (v, el) => {
            document.querySelectorAll('.view-section').forEach(x => x.classList.remove('active'));
            document.getElementById(v + 'View').classList.add('active');
            if(el) {
                document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));
                el.classList.add('active');
            }
        };
    </script>
</body>
</html>
